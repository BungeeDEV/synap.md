<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="synap.md — plain files, your server, no lock-in">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151821"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#C89B4C" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C89B4C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <!-- corner marks, echoing the [[ ]] motif as a frame -->
  <g stroke="#C89B4C" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" fill="none">
    <polyline points="24,46 24,24 46,24"/>
    <polyline points="1154,24 1176,24 1176,46"/>
    <polyline points="1176,234 1176,256 1154,256"/>
    <polyline points="46,256 24,256 24,234"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <tspan font-size="58" font-weight="300" fill="#C89B4C">[[</tspan><tspan font-size="56" font-weight="650" fill="#EDEDEE" dx="6">synap.md</tspan><tspan font-size="58" font-weight="300" fill="#C89B4C" dx="6">]]</tspan>
  </text>

  <line x1="560" y1="184" x2="640" y2="184" stroke="#C89B4C" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- tagline -->
  <text x="600" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" letter-spacing="3" fill="#8A8F98">PLAIN FILES  ·  YOUR SERVER  ·  NO LOCK-IN</text>
</svg>
